<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coconut Type Classifier</title>
<style>
  :root {
    --brown: #6b4226;
    --green: #2f7a3d;
    --cream: #fdf8f0;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #7a7a7a;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--cream), #f0ece2);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { margin: 0 0 6px; font-size: 2rem; color: var(--brown); }
  header p { margin: 0; color: var(--muted); }

  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 28px;
    width: 100%;
    max-width: 480px;
  }

  .dropzone {
    border: 2px dashed #cbbfa8;
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--green); background: #f4faf5; }
  .dropzone input { display: none; }
  .dropzone .hint { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

  #preview-wrap { text-align: center; margin-top: 18px; display: none; }
  #preview { max-width: 100%; max-height: 300px; border-radius: 10px; box-shadow: var(--shadow); }

  button#predict-btn {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button#predict-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button#predict-btn:not(:disabled):hover { opacity: 0.9; }

  #result { margin-top: 24px; display: none; }
  #result .label {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--brown);
    text-align: center;
  }
  #result .confidence { text-align: center; color: var(--muted); margin-bottom: 16px; }

  .bar-row { margin-bottom: 10px; }
  .bar-row .name { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
  .bar-bg { background: #eee; border-radius: 6px; overflow: hidden; height: 10px; }
  .bar-fill { height: 100%; background: var(--green); border-radius: 6px; transition: width 0.5s ease; }

  #error { color: #b02a2a; text-align: center; margin-top: 16px; display: none; }

  .spinner {
    width: 22px; height: 22px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { margin-top: 32px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>

<header>
  <h1>🥥 Coconut Type Classifier</h1>
  <p>Upload a photo to identify: Dwarf, King Coconut, or Tall</p>
</header>

<div class="card">
  <label class="dropzone" id="dropzone">
    <input type="file" id="file-input" accept="image/*">
    <div id="dz-text">
      <strong>Click to upload</strong> or drag & drop
      <div class="hint">JPG, PNG, or WEBP — up to 50MB</div>
    </div>
  </label>

  <div id="preview-wrap">
    <img id="preview" alt="Selected coconut image preview">
  </div>

  <button id="predict-btn" disabled>Classify Coconut</button>
  <div class="spinner" id="spinner"></div>

  <div id="error"></div>

  <div id="result">
    <div class="label" id="result-label"></div>
    <div class="confidence" id="result-confidence"></div>
    <div id="prob-bars"></div>
  </div>
</div>

<footer>Prototypical Network · EfficientNet-B0 embeddings · Cosine similarity</footer>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const previewWrap = document.getElementById('preview-wrap');
const preview = document.getElementById('preview');
const predictBtn = document.getElementById('predict-btn');
const spinner = document.getElementById('spinner');
const resultBox = document.getElementById('result');
const resultLabel = document.getElementById('result-label');
const resultConfidence = document.getElementById('result-confidence');
const probBars = document.getElementById('prob-bars');
const errorBox = document.getElementById('error');

let selectedFile = null;

function resetOutputs() {
  resultBox.style.display = 'none';
  errorBox.style.display = 'none';
  probBars.innerHTML = '';
}

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    previewWrap.style.display = 'block';
    predictBtn.disabled = false;
    resetOutputs();
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

['dragover', 'dragenter'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

predictBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  resetOutputs();
  predictBtn.disabled = true;
  spinner.style.display = 'block';

  const formData = new FormData();
  formData.append('image', selectedFile);

  try {
    const res = await fetch('/api/predict', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Prediction failed.');
    }

    resultLabel.textContent = data.prediction;
    resultConfidence.textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}%`;

    probBars.innerHTML = '';
    Object.entries(data.probabilities).forEach(([cls, p]) => {
      const pct = (p * 100).toFixed(1);
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="name"><span>${cls}</span><span>${pct}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      `;
      probBars.appendChild(row);
    });

    resultBox.style.display = 'block';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  } finally {
    spinner.style.display = 'none';
    predictBtn.disabled = false;
  }
});
</script>

</body>
</html>
